<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Your Cart - C&D PetStore</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <script src="/bootstrap/js/bootstrap.bundle.min.js"></script>
  <script src="cart.js" defer></script>
  <style>
    body { background-color: #ffb6c1; }
    .navbar-nav .nav-link i { margin-right: 6px; }

    /* --- Cohesive color palette --- */
    .navbar {
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.12);
    }
    .sale-badge {
      background-color: #ff6f91 !important;
    }
    .btn-theme {
      border: 1px solid #ff6f91;
      color: #d6336c;
      background-color: transparent;
      transition: background-color 0.2s ease, color 0.2s ease;
    }
    .btn-theme:hover {
      background-color: #ff6f91;
      color: #ffffff;
    }
    .site-footer {
      background-color: #b6ffeb;
    }
    #cart-toast {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background-color: #d6336c;
      color: #fff;
      padding: 10px 18px;
      border-radius: 8px;
      opacity: 0;
      transform: translateY(10px);
      transition: opacity 0.25s ease, transform 0.25s ease;
      pointer-events: none;
      z-index: 2000;
    }
    #cart-toast.show {
      opacity: 1;
      transform: translateY(0);
    }
  </style>
</head>
<body>

  <div id="cart-toast"></div>

  <!-- Navbar -->
  <nav class="navbar navbar-expand-sm" style="background-color: #ffb6c1;">
    <div class="container-fluid">
      <a class="navbar-brand" href="javascript:void(0)">C&D PetStore</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mynavbar">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="mynavbar">
        <ul class="navbar-nav me-auto">
          <li class="nav-item">
            <a class="nav-link" href="#"><i class="fas fa-paw"></i> Home</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="Dog.html"><i class="fas fa-dog"></i> DOG</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="Cat.html"><i class="fas fa-cat"></i> CAT</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="About-us.html"><i class="fas fa-heart"></i> About us</a>
          </li>
          <li class="nav-item">
            <a class="nav-link active" href="Shop.html"><i class="fas fa-cart-plus"></i> Shop</a>
          </li>
        </ul>
        <a href="Shop.html" class="btn btn-theme position-relative ms-2">
          <i class="fas fa-cart-shopping"></i>
          <span id="cart-count" class="badge sale-badge position-absolute top-0 start-100 translate-middle rounded-pill">0</span>
        </a>
      </div>
    </div>
  </nav>

  <!-- Hero -->
  <div class="p-5 text-dark text-center" style="background-color: #b6ffeb;">
    <h1>YOUR CART</h1>
    <p class="mb-0">Everything you've picked out from C&D PetStore</p>
  </div>

  <!-- Cart -->
  <div class="container my-5">
    <div class="row justify-content-center">
      <div class="col-lg-8">
        <div class="card border-0 shadow-sm p-4">

          <div id="cart-items">
            <!-- Filled in by cart.js -->
            <p class="text-center text-muted py-5">Your cart is empty. Go pick a pet! 🐾</p>
          </div>

          <div class="d-flex justify-content-between align-items-center border-top pt-4 mt-2">
            <button class="btn btn-outline-secondary btn-sm" onclick="clearCart()">Clear Cart</button>
            <h5 class="mb-0">Total: <span id="cart-total" class="text-danger">$0</span></h5>
          </div>

          <div class="text-center mt-4">
            <a href="Dog.html" class="btn btn-theme me-2">Continue Shopping - Dogs</a>
            <a href="Cat.html" class="btn btn-theme">Continue Shopping - Cats</a>
          </div>

        </div>
      </div>
    </div>
  </div>

  <!-- Footer -->
  <footer class="p-3 mb-3 site-footer">
    <div class="container">
      <p class="m-0 text-center text-dark">@Team 1</p>
    </div>
  </footer>
</body>
</html>
